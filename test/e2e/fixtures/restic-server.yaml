# In-cluster restic REST server backing Backup/Restore e2e tests.
# Plain HTTP, --no-auth — fine for a throwaway kind cluster, never
# acceptable in production. emptyDir: state lives only as long as the
# pod, which is exactly what test runs want.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameplane-test-restic
  namespace: gameplane-system
  labels:
    app.kubernetes.io/name: gameplane-test-restic
    app.kubernetes.io/component: e2e-fixture
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: gameplane-test-restic }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gameplane-test-restic }
    spec:
      containers:
        - name: restic
          image: restic/rest-server:0.14.0
          # The image's default CMD ("rest-server") gets clobbered if we
          # only set args; reinstate it explicitly so --no-auth lands as
          # a flag rather than as the executable.
          command: ["rest-server"]
          args: ["--listen", ":8000", "--no-auth"]
          ports:
            - { name: http, containerPort: 8000 }
          # Requests (no limits) make this Burstable rather than
          # Best-Effort. Best-Effort pods are the first to be node-pressure
          # evicted, and an eviction mid `restic init` leaves a half-written
          # `config` in the emptyDir that poisons every retry (rest-server
          # then 403s on the re-init). rest-server itself is tiny.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 2
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: gameplane-test-restic
  namespace: gameplane-system
  labels:
    app.kubernetes.io/name: gameplane-test-restic
    app.kubernetes.io/component: e2e-fixture
spec:
  selector: { app.kubernetes.io/name: gameplane-test-restic }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
# Default game-namespace egress allows only DNS. Backup/Restore Job pods
# run in gameplane-games and need to reach the restic-server in
# gameplane-system; the chart's own allow-backup-restore-egress policy
# (F-215) opens that traffic in production, keyed off the
# app.kubernetes.io/name=gameplane-backup-restore label the operator now
# stamps on those Job pods. Mirror that selector here (rather than
# podSelector: {}) so this fixture proves the operator's labeling, not
# just a namespace-wide hole: if a future change drops the label, this
# policy stops admitting the Job pod and the test fails.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-restic
  namespace: gameplane-games
  labels:
    app.kubernetes.io/component: e2e-fixture
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gameplane-backup-restore
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gameplane-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gameplane-test-restic
      ports:
        - { protocol: TCP, port: 8000 }
