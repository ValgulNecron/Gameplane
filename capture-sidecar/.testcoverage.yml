# Coverage threshold gate for the capture-sidecar module.
# Enforced by `make cover-go-check` via go-test-coverage/v2.
#
# The capture-sidecar is an optional ephemeral container that captures and
# records network traffic from game pods via AF_PACKET sockets and PCAPNG
# writing. Its tests cover BPF filter compilation and validation, PCAPNG file
# writing, the packet path through an injected synthetic PacketSource, the HTTP
# control plane (routing, start/stop/status/download, size and duration limits,
# path safety) and mTLS certificate handling. The gate is 70, matching sentinel
# and mcp-server; ratchet it up as coverage grows.
profile: coverage/unit.out
github-action-output: false

threshold:
  file: 0
  package: 0
  total: 70
