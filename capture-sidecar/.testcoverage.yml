# Coverage threshold gate for the capture-sidecar module.
# Enforced by `make cover-go-check` via go-test-coverage/v2.
#
# The capture-sidecar is an optional ephemeral container that captures and
# records network traffic from game pods via AF_PACKET sockets and PCAPNG
