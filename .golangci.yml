version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose      # catches unclosed http.Response.Body leaks
    - errcheck       # flags ignored error returns
    - gosec          # security-focused static analysis (CWEs, hardcoded creds, etc.)
    - govet          # stdlib vet
    - ineffassign    # dead assignments
    - staticcheck    # broad correctness checks
    - unused         # dead code
    - misspell
    - revive         # replaces golint
    - unparam        # unused function parameters
    - nilerr         # "return nil" where err should be returned
    - noctx          # http.Request without context
    - errorlint      # errors.Is / errors.As usage
    - contextcheck   # functions that should take context but don't

  settings:
    gosec:
      # Exclude noisy rules that don't map to the codebase's threat model:
      # - G104: "Errors unhandled" — errcheck covers this more precisely.
      # - G204: "subprocess launched with variable" — we don't exec shell.
      excludes: [G104]
    errcheck:
      check-type-assertions: true
      check-blank: false

  exclusions:
    rules:
      # Tests often ignore errors deliberately in setup. Keep loud elsewhere.
      - path: _test\.go
        linters: [errcheck, gosec, unparam]
      # Reconciler builder helpers have a lot of repeated patterns; revive
      # can get noisy on them without catching real bugs.
      # The linter runs per-module with that module as the working directory,
      # so paths are relative (e.g., internal/controller/foo.go), not absolute.
      - path: (^|/)internal/controller/
        linters: [revive]
        text: "exported:"
      # Minecraft VarInt encoding/decoding requires lossless reinterpretation between uint32
      # and int32 (two's complement). All 32 bits are preserved; length and range overflow
      # are still checked explicitly in the code. G115 remains active everywhere else.
      - path: (gameproto/)?minecraft\.go$
        linters: [gosec]
        text: "G115"
      # Kubectl/KubectlWithStdin/port-forward helpers exist to run kubectl with
      # caller-supplied arguments - that's the whole point of an E2E harness. The
      # args come from the suite's own test code (not external input), and the
      # helper already rejects shell metacharacters ahead of the -- separator,
      # which gosec's static analysis can't see. G204 remains active everywhere else.
      - path: (^|/)env\.go$
        linters: [gosec]
        text: "G204"
      # The Satisfactory probe dials the game server's HTTPS API over a pod-local
      # address. The server generates a self-signed cert at first boot, so there is
      # no cert to pin in advance, and the connection never leaves the pod network,
      # so there's no off-host position to intercept it from. G402 remains active
      # everywhere else.
      - path: (^|/)internal/satisfactory/app\.go$
        linters: [gosec]
        text: "G402"

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-same-issues: 20
  max-issues-per-linter: 50
