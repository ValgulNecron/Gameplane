# Coverage threshold gate for the shared svcutil module.
# Enforced by `make cover-go-check` via go-test-coverage/v2.
#
# svcutil holds shared env and graceful-shutdown helpers used across multiple
# binaries. It is pure stdlib with thorough table tests for env parsing and
# server lifecycle; gate at 90%. The small gap is in edge cases of the shutdown
# path (context timeout races that are difficult to trigger reliably in tests).
profile: coverage/unit.out
github-action-output: false

threshold:
  file: 0
  package: 0
  total: 90
