name: dump cluster state on failure
description: >
  Dump diagnostic cluster state (resources, pod descriptions, component logs)
  when an e2e job fails. Does not fail the job itself — all kubectl/helm commands
  run with `|| true` to ensure the step completes even if inspection fails.
inputs:
  context:
    description: kubectl context to query (required)
    required: true
  namespaces:
    description: Comma-separated list of namespaces to describe pods in
    required: false
    default: "gameplane-system"
  include-previous-logs:
    description: Include --previous operator logs (for crash diagnostics)
    required: false
    default: "false"
  include-helm-history:
    description: Include helm release history (for upgrade jobs)
    required: false
    default: "false"
  include-get-jobs:
    description: Include kubectl get jobs output
    required: false
    default: "false"
  include-operator-logs:
    description: Include operator component logs
    required: false
    default: "true"
  include-api-logs:
    description: Include API component logs
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: dump cluster state (resources and pods)
      shell: bash
      run: |
        redact() {
          sed \
            -e 's/\([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]\|[Pp][Aa][Ss][Ss][Ww][Dd]\|[Tt][Oo][Kk][Ee][Nn]\|[Ss][Ee][Cc][Rr][Ee][Tt]\|[Aa][Pp][Ii][-_]\?[Kk][Ee][Yy]\|[Bb][Ee][Aa][Rr][Ee][Rr]\|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]\)\([[:space:]]*[=:][[:space:]]*\).*/\1\2***REDACTED***/g' \
            -e 's/eyJ[A-Za-z0-9_-]\{10,\}\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*/***REDACTED-JWT***/g' \
            -e '/-----BEGIN [A-Z ]*PRIVATE KEY-----/,/-----END [A-Z ]*PRIVATE KEY-----/c\***REDACTED-KEY***'
        }

        ctx="${{ inputs.context }}"

        # Always dump top-level resources
        kubectl --context "$ctx" get all -A 2>&1 | redact || true

        # Describe pods in specified namespaces
        IFS=',' read -ra NS_ARRAY <<< "${{ inputs.namespaces }}"
        for ns in "${NS_ARRAY[@]}"; do
          ns=$(echo "$ns" | xargs)  # trim whitespace
          kubectl --context "$ctx" describe pods -n "$ns" 2>&1 | redact || true
        done

    - name: dump operator logs
      if: inputs.include-operator-logs == 'true'
      shell: bash
      run: |
        redact() {
          sed \
            -e 's/\([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]\|[Pp][Aa][Ss][Ss][Ww][Dd]\|[Tt][Oo][Kk][Ee][Nn]\|[Ss][Ee][Cc][Rr][Ee][Tt]\|[Aa][Pp][Ii][-_]\?[Kk][Ee][Yy]\|[Bb][Ee][Aa][Rr][Ee][Rr]\|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]\)\([[:space:]]*[=:][[:space:]]*\).*/\1\2***REDACTED***/g' \
            -e 's/eyJ[A-Za-z0-9_-]\{10,\}\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*/***REDACTED-JWT***/g' \
            -e '/-----BEGIN [A-Z ]*PRIVATE KEY-----/,/-----END [A-Z ]*PRIVATE KEY-----/c\***REDACTED-KEY***'
        }

        ctx="${{ inputs.context }}"
        kubectl --context "$ctx" logs -n gameplane-system -l app.kubernetes.io/name=gameplane-operator --tail=200 2>&1 | redact || true

        if [ "${{ inputs.include-previous-logs }}" = "true" ]; then
          kubectl --context "$ctx" logs -n gameplane-system -l app.kubernetes.io/name=gameplane-operator --previous --tail=200 2>&1 | redact || true
        fi

    - name: dump API logs
      if: inputs.include-api-logs == 'true'
      shell: bash
      run: |
        redact() {
          sed \
            -e 's/\([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]\|[Pp][Aa][Ss][Ss][Ww][Dd]\|[Tt][Oo][Kk][Ee][Nn]\|[Ss][Ee][Cc][Rr][Ee][Tt]\|[Aa][Pp][Ii][-_]\?[Kk][Ee][Yy]\|[Bb][Ee][Aa][Rr][Ee][Rr]\|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]\)\([[:space:]]*[=:][[:space:]]*\).*/\1\2***REDACTED***/g' \
            -e 's/eyJ[A-Za-z0-9_-]\{10,\}\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*/***REDACTED-JWT***/g' \
            -e '/-----BEGIN [A-Z ]*PRIVATE KEY-----/,/-----END [A-Z ]*PRIVATE KEY-----/c\***REDACTED-KEY***'
        }

        ctx="${{ inputs.context }}"
        kubectl --context "$ctx" logs -n gameplane-system -l app.kubernetes.io/name=gameplane-api --tail=200 2>&1 | redact || true

    - name: dump helm history (optional)
      if: inputs.include-helm-history == 'true'
      shell: bash
      run: |
        redact() {
          sed \
            -e 's/\([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]\|[Pp][Aa][Ss][Ss][Ww][Dd]\|[Tt][Oo][Kk][Ee][Nn]\|[Ss][Ee][Cc][Rr][Ee][Tt]\|[Aa][Pp][Ii][-_]\?[Kk][Ee][Yy]\|[Bb][Ee][Aa][Rr][Ee][Rr]\|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]\)\([[:space:]]*[=:][[:space:]]*\).*/\1\2***REDACTED***/g' \
            -e 's/eyJ[A-Za-z0-9_-]\{10,\}\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*/***REDACTED-JWT***/g' \
            -e '/-----BEGIN [A-Z ]*PRIVATE KEY-----/,/-----END [A-Z ]*PRIVATE KEY-----/c\***REDACTED-KEY***'
        }

        ctx="${{ inputs.context }}"
        helm --kube-context "$ctx" history gameplane -n gameplane-system 2>&1 | redact || true

    - name: dump jobs (optional)
      if: inputs.include-get-jobs == 'true'
      shell: bash
      run: |
        redact() {
          sed \
            -e 's/\([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]\|[Pp][Aa][Ss][Ss][Ww][Dd]\|[Tt][Oo][Kk][Ee][Nn]\|[Ss][Ee][Cc][Rr][Ee][Tt]\|[Aa][Pp][Ii][-_]\?[Kk][Ee][Yy]\|[Bb][Ee][Aa][Rr][Ee][Rr]\|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]\)\([[:space:]]*[=:][[:space:]]*\).*/\1\2***REDACTED***/g' \
            -e 's/eyJ[A-Za-z0-9_-]\{10,\}\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*/***REDACTED-JWT***/g' \
            -e '/-----BEGIN [A-Z ]*PRIVATE KEY-----/,/-----END [A-Z ]*PRIVATE KEY-----/c\***REDACTED-KEY***'
        }

        ctx="${{ inputs.context }}"
        kubectl --context "$ctx" get jobs -n gameplane-system 2>&1 | redact || true

    - name: dump game pod container logs and statuses
      shell: bash
      run: |
        set +e

        redact() {
          sed \
            -e 's/\([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]\|[Pp][Aa][Ss][Ss][Ww][Dd]\|[Tt][Oo][Kk][Ee][Nn]\|[Ss][Ee][Cc][Rr][Ee][Tt]\|[Aa][Pp][Ii][-_]\?[Kk][Ee][Yy]\|[Bb][Ee][Aa][Rr][Ee][Rr]\|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]\)\([[:space:]]*[=:][[:space:]]*\).*/\1\2***REDACTED***/g' \
            -e 's/eyJ[A-Za-z0-9_-]\{10,\}\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*/***REDACTED-JWT***/g' \
            -e '/-----BEGIN [A-Z ]*PRIVATE KEY-----/,/-----END [A-Z ]*PRIVATE KEY-----/c\***REDACTED-KEY***'
        }

        ctx="${{ inputs.context }}"

        echo "=== Game pod container logs and statuses ===" | redact

        # Parse namespaces; fall back to gameplane-games if none specified.
        namespaces="${{ inputs.namespaces }}"
        if [ -z "$namespaces" ]; then
          namespaces="gameplane-games"
        fi

        # Process each namespace. Deliberately skip gameplane-system here:
        # its pods (operator, api) are already covered by the dedicated
        # "dump operator logs" / "dump API logs" steps above, keyed off
        # workload label selectors rather than every pod/container in the
        # namespace — redumping them here would just bury the game-pod
        # output this step exists for. Callers that pass only
        # "gameplane-system" (the input's own default) intentionally get no
        # output from this step; game pods live in gameplane-games.
        printf '%s\n' "$namespaces" | tr ',' '\n' | while IFS= read -r ns; do
          ns=$(printf '%s' "$ns" | xargs)
          if [ -z "$ns" ] || [ "$ns" = "gameplane-system" ]; then
            continue
          fi

          echo ""
          echo "--- Namespace: $ns ---"

          # List all pods in the namespace (guard against missing namespace)
          pod_list=$(kubectl --context "$ctx" get pods -n "$ns" -o jsonpath='{.items[*].metadata.name}' 2>&1)
          if [ -z "$pod_list" ]; then
            continue
          fi

          printf '%s\n' "$pod_list" | tr ' ' '\n' | while IFS= read -r pod; do
            if [ -z "$pod" ]; then
              continue
            fi

            echo ""
            echo "Pod: $pod"

            # Dump regular container logs
            container_list=$(kubectl --context "$ctx" get pod "$pod" -n "$ns" -o jsonpath='{.spec.containers[*].name}' 2>&1)
            if [ -n "$container_list" ]; then
              printf '%s\n' "$container_list" | tr ' ' '\n' | while IFS= read -r container; do
                if [ -z "$container" ]; then
                  continue
                fi

                echo ""
                echo "Container: $container"

                echo "--- Current logs (last 100 lines) ---"
                kubectl --context "$ctx" logs -n "$ns" "$pod" -c "$container" --tail=100 2>&1 | redact

                echo "--- Previous logs (if restarted, last 100 lines) ---"
                kubectl --context "$ctx" logs -n "$ns" "$pod" -c "$container" --previous --tail=100 2>&1 | redact

                echo "--- Container status ---"
                kubectl --context "$ctx" get pod "$pod" -n "$ns" -o jsonpath="{range .status.containerStatuses[?(@.name==\"$container\")]}{.name}{'\t'}{.ready}{'\t'}{.restartCount}{'\t'}{.state}{'\t'}{.lastState}{'\n'}{end}" 2>&1 | redact
              done
            fi

            # Dump ephemeral container logs (capture, agent)
            ephemeral_list=$(kubectl --context "$ctx" get pod "$pod" -n "$ns" -o jsonpath='{.spec.ephemeralContainers[*].name}' 2>&1)
            if [ -n "$ephemeral_list" ]; then
              printf '%s\n' "$ephemeral_list" | tr ' ' '\n' | while IFS= read -r container; do
                if [ -z "$container" ]; then
                  continue
                fi

                echo ""
                echo "Ephemeral Container: $container"

                echo "--- Current logs (last 100 lines) ---"
                kubectl --context "$ctx" logs -n "$ns" "$pod" -c "$container" --tail=100 2>&1 | redact

                echo "--- Previous logs (if restarted, last 100 lines) ---"
                kubectl --context "$ctx" logs -n "$ns" "$pod" -c "$container" --previous --tail=100 2>&1 | redact

                echo "--- Ephemeral container status ---"
                kubectl --context "$ctx" get pod "$pod" -n "$ns" -o jsonpath="{range .status.ephemeralContainerStatuses[?(@.name==\"$container\")]}{.name}{'\t'}{.ready}{'\t'}{.restartCount}{'\t'}{.state}{'\t'}{.lastState}{'\n'}{end}" 2>&1 | redact
              done
            fi
          done
        done

        # This step is best-effort diagnostics only (runs under if: failure())
        # and must never itself fail the job, regardless of how the nested
        # loops/pipelines above resolved their exit status.
        exit 0
