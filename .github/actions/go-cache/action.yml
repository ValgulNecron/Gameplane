name: go module + build cache
description: >
  Cache Go modules and build artifacts. setup-go's built-in cache keys off a
  repo-root go.sum, which this go.work workspace doesn't have — use an explicit
  per-module cache instead so each matrix leg (or job) saves its own build cache.

inputs:
  key-suffix:
    description: >-
      Suffix for the cache key, e.g. "lint-operator" or "e2e". Callers interpolate
      their own matrix values; this file must not, since composite actions have no
      matrix context and an expression here fails the whole action at load time.
    required: true
  go-version:
    description: Go version to setup
    required: false
    default: '1.26'

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: false
    - name: go module + build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ inputs.key-suffix }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ inputs.key-suffix }}-
