# Screenshot Refresh — Automatic dashboard UI updates on release
#
# Purpose: Regenerate dashboard screenshots (via Playwright mock mode with MSW) on
# release tag push, and open a pull request with refreshed images. Screenshot captures
# run in CI (not locally, per CLAUDE.md rule 8); all images are reproducible and
# deterministic using mocked API data.
#
# Triggers:
# - on: push tags v* (automatic on release tag; opened PR triggers CI normally)
# - on: push branch 012-docs-refresh-and-outreach (TEMPORARY feature 012 bootstrap; remove once first screenshot PR lands)
# - on: workflow_dispatch (manual on-demand capture; requires SCREENSHOT_BOT_PAT secret)
#
# Credential: Fine-grained Personal Access Token `SCREENSHOT_BOT_PAT` (this repo only,
# Contents read/write, Pull requests read/write). Unlike GITHUB_TOKEN, PRs opened with
# this PAT trigger CI workflows normally. See OD-13 (2026-09-02).
#
# Security: No dependency or browser caches are restored in this workflow: it publishes
# runtime artifacts (screenshots) on a tag push, and zizmor's cache-poisoning audit
# forbids caches there (poisoned cache could inject content into published artifacts).
# setup-node's default package-manager cache is explicitly disabled.

name: screenshot refresh

on:
  push:
    tags:
      - "v*"
    # TEMPORARY (feature 012 bootstrap): registers the workflow and captures the first gallery before merge; remove once the first screenshot PR has landed.
    branches:
      - "012-docs-refresh-and-outreach"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshot-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh dashboard screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm ci

      - name: install chromium
        run: npx playwright install --with-deps chromium

      - run: npm run screenshots

      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-screenshots
          path: web/playwright-report
          retention-days: 7
          if-no-files-found: warn

      - name: commit screenshots and open pull request
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.SCREENSHOT_BOT_PAT }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if git status --porcelain -- docs/img | grep -q .; then
            :
          else
            echo "no screenshot changes"
            exit 0
          fi

          base="$DEFAULT_BRANCH"
          case "$REF" in refs/tags/*) ;; *) base="$REF_NAME" ;; esac

          branch="chore/screenshot-refresh-${REF_NAME}"

          git config user.name gameplane-screenshot-bot
          git config user.email gameplane-screenshot-bot@users.noreply.github.com

          git checkout -b "$branch"
          git add docs/img/*.jpg
          git commit -s -m "chore: refresh dashboard screenshots (${REF_NAME})" -m "Generated by .github/workflows/screenshot-refresh.yaml (OD-3c)."

          # Authenticate the push through a credential helper that reads the
          # token from the environment: the secret never appears in argv (the
          # runner's process table is not masked) nor in .git/config.
          helper="$RUNNER_TEMP/git-credential-env"
          cat >"$helper" <<'EOF'
          #!/bin/sh
          printf 'username=x-access-token\npassword=%s\n' "$GH_TOKEN"
          EOF
          chmod 0700 "$helper"
          git config --local credential.helper "$helper"
          # The bot branch is disposable: a re-run on the same ref replaces it.
          git push --force origin "HEAD:${branch}"

          existing="$(gh pr list --head "$branch" --base "$base" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "updated existing PR #$existing"
          else
            gh pr create \
              --base "$base" \
              --head "$branch" \
              --title "chore: refresh dashboard screenshots (${REF_NAME})" \
              --body-file <(printf "Automated dashboard screenshot refresh on %s release tag.\n\nBase: %s\nTrigger: %s\n\nSee contract: specs/012-docs-refresh-and-outreach/contracts/screenshot-set.md (OD-3 Decision).\n" "$REF_NAME" "$base" "$EVENT_NAME")
          fi
