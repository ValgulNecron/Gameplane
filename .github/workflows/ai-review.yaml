name: ai-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

env:
  # ~200 KB ≈ 50k tokens, roughly a quarter of the review context, leaving room
  # for the constitution, CLAUDE.md and the touched specs.md. Larger diffs are
  # truncated with an explicit marker so the reviewer knows it is seeing a partial change.
  MAX_DIFF_BYTES: 200000
  # GitHub's own PR title limit is 256; 200 keeps a margin and a title is a
  # headline, not prose.
  MAX_TITLE_CHARS: 200
  # Enough for a real PR description with a checklist; bounds how much
  # attacker-controlled text enters the prompt at all.
  MAX_BODY_CHARS: 4000

jobs:
  collect:
    name: collect metadata & diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: compute base diff
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Compute the diff from origin/base to HEAD, truncate to MAX_DIFF_BYTES
          diff_output=$(git diff origin/$BASE_REF...HEAD 2>/dev/null || git diff $BASE_REF...HEAD 2>/dev/null || echo "")

          # Truncate if needed
          diff_bytes=$(printf "%s" "$diff_output" | wc -c)
          if [ "$diff_bytes" -gt "$MAX_DIFF_BYTES" ]; then
            diff_output=$(printf "%s" "$diff_output" | head -c "$MAX_DIFF_BYTES")
            diff_output="${diff_output}

          [TRUNCATED — diff exceeds $MAX_DIFF_BYTES bytes]"
          fi

          # Write to a file for the next step
          printf "%s" "$diff_output" > /tmp/diff.txt

      - name: build metadata JSON
        id: payload
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Sanitise title and body: strip backticks and ${, truncate
          sanitise() {
            local input="$1"
            local max_len="$2"
            # Strip backticks and ${
            input="${input//\`/}"
            input="${input//\$\{/}"
            # Truncate
            if [ ${#input} -gt "$max_len" ]; then
              input="${input:0:$max_len}"
            fi
            printf "%s" "$input"
          }

          title=$(sanitise "$TITLE" "$MAX_TITLE_CHARS")
          body=$(sanitise "$BODY" "$MAX_BODY_CHARS")

          # Read diff from file (already truncated)
          diff_content=$(cat /tmp/diff.txt)

          # Count changed files
          changed_files=$(git diff --name-only origin/$BASE_REF...HEAD 2>/dev/null | wc -l)

          # Build JSON payload with jq for safe escaping
          jq -n \
            --arg pr "$PR_NUMBER" \
            --arg sha "$HEAD_SHA" \
            --arg base "$BASE_REF" \
            --arg title "$title" \
            --arg body "$body" \
            --arg diff "$diff_content" \
            --arg files "$changed_files" \
            '{
              pr_number: $pr,
              head_sha: $sha,
              base_ref: $base,
              title: $title,
              body: $body,
              diff: $diff,
              changed_files: $files
            }' > /tmp/ai-review-payload.json

      - name: upload ai-review-payload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ai-review-payload
          path: /tmp/ai-review-payload.json
          retention-days: 1
          if-no-files-found: warn

      - name: assert ANTHROPIC_API_KEY not in environment
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "ERROR: collect job must not have ANTHROPIC_API_KEY in environment"
            exit 1
          fi
