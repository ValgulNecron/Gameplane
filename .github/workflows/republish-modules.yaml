name: republish-modules

# Manually re-push (and re-sign) the official game-module bundles to GHCR
# without cutting a release. release.yaml only publishes bundles on a `v*`
# tag, so an out-of-band fix to module metadata (e.g. a corrected
# gameplaneMinVersion) would otherwise wait for the next release. This
# workflow republishes exactly the bundles the superproject currently pins
# (submodule pointer) — bump the `modules/` pointer on main first if you want
# the latest module commits.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  modules:
    name: push & sign module bundles
    runs-on: ubuntu-latest
    steps:
      # The module bundles live in the gameplane-module submodule at modules/,
      # so this job needs a recursive checkout to read their source. The
      # submodule is public, so the default GITHUB_TOKEN clones it (no PAT).
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Signing is mandatory: fail rather than publish unsigned bundles (or
      # silently publish none at all).
      - name: require signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error::COSIGN_PRIVATE_KEY is required for official module bundle publishing"
            exit 1
          fi
      - name: install oras
        uses: oras-project/setup-oras@v2
      - name: install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.2'
      - name: refresh sigstore trust root
        run: cosign initialize
      - name: login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # --tlog-upload records each bundle signature in the public Rekor
      # transparency log (see release.yaml's modules job).
      - name: push & sign bundles
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          modules/build.sh push \
            --registry "ghcr.io/${owner_lc}/gameplane-modules" \
            --sign --tlog-upload --tag-latest
