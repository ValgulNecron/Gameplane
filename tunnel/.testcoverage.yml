# Coverage threshold gate for the tunnel module.
# Enforced by `make cover-go-check` via go-test-coverage/v2.
#
# The tunnel supervisor configures and supervises a third-party relay process
# (frp, Tailscale, or playit). Tests cover env parsing, credential reading,
# config file rendering per provider, backoff behavior, and context shutdown.
# Child process spawning and relay operation are not unit-testable. Gate below
# measured; ratchet up as coverage grows.
profile: coverage/unit.out
github-action-output: false

threshold:
  file: 0
  package: 0
  total: 70
